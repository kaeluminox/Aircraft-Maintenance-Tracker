<!DOCTYPE html>
<html>
<head>
    <title>Daftar Maintenance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/add">Tambah Data</a>
        <a href="/view">Lihat Data</a>
        <a href="/dashboard">Dashboard</a>
    </nav>
    <div class="container">
        <h1>Daftar Data Maintenance</h1>

        <form method="GET" action="/view">
            <label>Filter Status:</label>
            <select name="status" onchange="this.form.submit()">
                <option value="All" {% if not selected_status or selected_status == "All" %}selected{% endif %}>All</option>
                <option value="Pending" {% if selected_status == "Pending" %}selected{% endif %}>Pending</option>
                <option value="In Progress" {% if selected_status == "In Progress" %}selected{% endif %}>In Progress</option>
                <option value="Completed" {% if selected_status == "Completed" %}selected{% endif %}>Completed</option>
            </select>
        </form>
        <br>

        <table>
            <tr>
                <th>Aircraft/Component</th>
                <th>Task</th>
                <th>Status</th>
                <th>Date</th>
                <th>Aksi</th>
            </tr>
            {% for item in data %}
            <tr>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
                <td>{{ item[3] }}</td>
                <td>{{ item[4] }}</td>
                <td>
                    <a href="/edit/{{ item[0] }}">Edit</a>
                    <form method="POST" action="/delete/{{ item[0] }}" style="display:inline">
                        <button type="submit">Hapus</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
        <br>
        <a href="/add">Tambah Data Baru</a>
    </div>
</body>
</html>
